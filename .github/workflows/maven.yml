name: Java CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional surefire -Dtest selector; empty runs the full suite'
        required: false
        default: ''

jobs:
  build:

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: [ 8, 11, 14 ]
        experimental: [false]
        include:
          - java: 15-ea
            os: ubuntu-latest
            experimental: true        
          - java: 15-ea
            os: windows-latest
            experimental: true        
      fail-fast: false
        
    steps:
    - uses: actions/checkout@v2.3.2
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v2
      with:
        distribution: 'adopt'
        java-version: ${{ matrix.java }}
    - name: Build with Maven
      shell: bash
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          mvn -V --file pom.xml --no-transfer-progress -DtrimStackTrace=false -Drat.skip=true -DfailIfNoTests=false "-Dtest=${{ inputs.test-filter }}"
        else
          mvn -V --file pom.xml --no-transfer-progress -DtrimStackTrace=false -Drat.skip=true
        fi
    - name: List skipped tests and their reasons
      shell: bash
      run: |
        echo "Skipped tests and their reasons (from target/surefire-reports):"
        awk '/<testcase/{tc=$0} /<skipped/{print FILENAME ": " tc " " $0}' target/surefire-reports/TEST-*.xml
    - name: Upload Maven build artifacts
      if: success() && matrix.os == 'ubuntu-latest' && matrix.java == 8
      uses: actions/upload-artifact@v4
      with:
        name: built-jars
        path: |
          target/commons-io-2.8.0.jar
          target/commons-io-2.8.0-tests.jar
        if-no-files-found: error
